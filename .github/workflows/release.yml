name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile runtime modules
        run: python -m compileall -q main.py marvel_rivals_bot qq_official rendering tests tools
      - name: Validate tag, versions, and source
        run: python tools/release.py --check --tag "${GITHUB_REF_NAME}"
      - name: Build release archive
        run: python tools/release.py --build "dist/astrbot_plugin_marvel_rivals-${GITHUB_REF_NAME}.zip" --tag "${GITHUB_REF_NAME}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "dist/astrbot_plugin_marvel_rivals-${GITHUB_REF_NAME}.zip" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
